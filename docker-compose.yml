# =============================================================================
# Colorsin S.A.S. — sistema completo con un solo comando
#
#   docker compose up -d
#
# Eso levanta la base de datos, la API y el frontend. No hace falta tener
# instalados .NET, Node ni MySQL: las imagenes vienen de Docker Hub y Compose
# las descarga si no estan. Tampoco hace falta crear ningun archivo: todas las
# variables de abajo traen un valor por defecto de desarrollo.
#
#   Aplicacion   http://localhost:8080
#   API          http://localhost:5121
#   MySQL        localhost:3307
#
# PARA RECONSTRUIR LAS IMAGENES desde el codigo en vez de bajarlas:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# SOBRE LOS VALORES POR DEFECTO. Son de desarrollo y estan a la vista a
# proposito: el requisito era que esto arrancara sin configurar nada. Para
# cualquier uso real se sobrescriben creando un `.env` junto a este archivo
# -Compose lo carga solo- o exportando las variables en el entorno. El `.env` no
# se versiona; la plantilla `.env.example` si.
#
# La clave de firma de los tokens NO esta aqui, y no es un olvido: se genera
# sola dentro del contenedor de la API. Ver `back/entrypoint.sh`.
# =============================================================================
name: colorsin

services:
  # ---------------------------------------------------------------------------
  # Base de datos MySQL 8.4 (LTS)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: colorsin_mysql
    restart: unless-stopped

    # Parámetros del servidor. Van aquí y NO en un archivo .cnf montado porque
    # los bind mounts de Windows llegan con permisos 0777 y MySQL ignora por
    # seguridad todo archivo de configuración escribible por todos
    # ("World-writable config file ... is ignored").
    command:
      # Juego de caracteres: tildes, ñ y emojis.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Hora de Colombia (UTC-5).
      - --default-time-zone=-05:00
      # Conexiones y rendimiento para desarrollo local.
      - --max-connections=150
      - --innodb-buffer-pool-size=512M
      - --innodb-flush-log-at-trx-commit=2
      # Registra consultas de más de 1 segundo: útil para afinar el inventario.
      - --slow-query-log=1
      - --long-query-time=1

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-colorsin_dev_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-colorsin_inventario}
      MYSQL_USER: ${MYSQL_USER:-colorsin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-colorsin_dev_app}
      TZ: America/Bogota

    ports:
      # host:contenedor -> te conectas desde Windows a localhost:3307
      # (3307 en el host para no chocar con un MySQL instalado localmente)
      - "3307:3306"

    volumes:
      # Volumen persistente: los datos sobreviven a `docker compose down`.
      - mysql_data:/var/lib/mysql
      # Scripts que corren UNA sola vez, cuando el volumen está vacío.
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # Doble verificación: el servidor responde Y la base + usuario de app existen.
      # El doble signo `$$` evita que Compose interpole la variable: la expande
      # el shell DENTRO del contenedor, así la clave nunca queda en el YAML.
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
          && mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD"
          -D "$$MYSQL_DATABASE" -e "SELECT 1" > /dev/null 2>&1
      interval: 10s        # cada cuánto se repite la prueba
      timeout: 5s          # cuánto espera cada intento
      retries: 10          # fallos seguidos antes de marcarlo "unhealthy"
      start_period: 40s    # margen inicial: el primer arranque crea la BD

    networks:
      - colorsin_net

  # ---------------------------------------------------------------------------
  # API .NET 10
  # ---------------------------------------------------------------------------
  api:
    image: juliana0212/colorsin-api:1.0.0
    container_name: colorsin_api
    restart: unless-stopped

    # `service_healthy` y no `service_started`: el contenedor de MySQL existe
    # mucho antes de que la base este lista, y en el primer arranque hay veinte
    # scripts de inicializacion por delante. Sin esperar al healthcheck, la API
    # arranca, no encuentra las tablas y se cae.
    depends_on:
      mysql:
        condition: service_healthy

    environment:
      # Development deja encendido OpenAPI en /openapi/v1.json, util para
      # revisar la API del contenedor. No expone secretos: appsettings.json solo
      # lleva marcadores.
      ASPNETCORE_ENVIRONMENT: Development

      # `mysql` es el NOMBRE DEL SERVICIO, que la red interna de Compose
      # resuelve. Y el puerto es 3306, no 3307: 3307 solo existe en el host.
      # Entre contenedores se habla por el puerto real.
      ConnectionStrings__DefaultConnection: >-
        Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-colorsin_inventario};Uid=${MYSQL_USER:-colorsin};Pwd=${MYSQL_PASSWORD:-colorsin_dev_app};

      # El frontend llama por el mismo origen a traves de nginx, asi que en el
      # camino normal no hay CORS. Esto es para quien abra la API directamente
      # en localhost:5121 desde otra pagina.
      Cors__OrigenesPermitidos__0: http://localhost:8080

      # Sin valor por defecto a proposito: si no se define, el contenedor genera
      # una clave aleatoria y la guarda en su volumen. Ver back/entrypoint.sh.
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:-}

    ports:
      - "5121:8080"

    volumes:
      # Guarda la clave de firma generada. Sin esto, cada reinicio invalidaria
      # las sesiones abiertas.
      - api_claves:/var/lib/colorsin

    healthcheck:
      # Comprueba que Kestrel escucha, usando /dev/tcp de bash: la imagen de
      # Microsoft no trae curl ni wget, y anadirlos solo para esto engordaria la
      # imagen. Que el puerto este abierto dice bastante en esta API, porque
      # valida su configuracion AL ARRANCAR y no levanta si algo falta.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - colorsin_net

  # ---------------------------------------------------------------------------
  # Frontend React, servido por nginx
  # ---------------------------------------------------------------------------
  front:
    image: juliana0212/colorsin-front:1.0.0
    container_name: colorsin_front
    restart: unless-stopped

    # nginx resuelve `api` al CARGAR su configuracion, no en cada peticion: si
    # el nombre no existe todavia, no arranca y se queda reiniciandose.
    depends_on:
      api:
        condition: service_healthy

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - colorsin_net

volumes:
  mysql_data:
    name: colorsin_mysql_data
  api_claves:
    name: colorsin_api_claves

networks:
  colorsin_net:
    name: colorsin_net
    driver: bridge
