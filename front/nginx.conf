# =============================================================================
# nginx del frontend: sirve la aplicacion y hace de pasarela hacia la API.
# =============================================================================

server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Comprime lo que se repite mucho. El paquete de JavaScript son ~520 KB que
    # bajan a ~153 KB; en una conexion lenta es la diferencia entre abrir la
    # pagina y esperarla.
    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # -------------------------------------------------------------------------
    # La API, por el MISMO origen que la pagina
    #
    # POR QUE UNA PASARELA Y NO LLAMAR DIRECTO A LA API. Si el navegador llamara
    # a http://localhost:5121 desde una pagina servida en http://localhost:8080,
    # serian dos origenes distintos y cada peticion pasaria por CORS: sondeo
    # previo, lista blanca que mantener y un fallo silencioso en cuanto alguien
    # cambie un puerto. Reenviando desde aqui, para el navegador todo vive en el
    # mismo sitio y el problema no existe.
    #
    # Ademas no hace falta publicar el puerto de la API hacia fuera: la red
    # interna de Compose alcanza a `api` por su nombre, y la base de datos y la
    # API quedan sin exponer.
    #
    # LA BARRA FINAL DE `proxy_pass` NO ES OPCIONAL. Con ella, nginx sustituye
    # el prefijo `/api/` por el destino y `/api/auth/login` sale como
    # `/api/auth/login`. Sin ella lo CONCATENA, y saldria `/api/api/auth/login`.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;

        # Sin esto la API ve como cliente a nginx y no a quien pregunta. Importa
        # para el limite de cinco intentos de sesion por minuto, que es POR IP:
        # sin reenviar la original, todos los usuarios compartirian el cupo y el
        # primero en equivocarse de clave dejaria fuera a los demas.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un informe de cumplimiento sobre un periodo largo puede tardar.
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # Los archivos con huella digital en el nombre -index-CZn8uERE.js- se pueden
    # cachear para siempre: si el contenido cambia, cambia el nombre.
    # -------------------------------------------------------------------------
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # El index NO se cachea. Es el unico archivo con nombre fijo, y es quien
    # nombra a los demas: si el navegador se queda con uno viejo, seguira
    # pidiendo paquetes que ya no existen y la pagina saldra en blanco tras cada
    # despliegue.
    # -------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # -------------------------------------------------------------------------
    # ULTIMO, y a proposito: en nginx un prefijo mas especifico gana, asi que
    # /api/ y /assets/ de arriba se resuelven antes que esto.
    #
    # El enrutado lo hace React en el navegador, no el servidor: /traslados no
    # es una carpeta. Sin este `try_files`, recargar la pagina en cualquier ruta
    # que no sea la raiz daria un 404 de nginx.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
